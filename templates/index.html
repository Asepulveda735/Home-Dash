<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hubert</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.6.1/socket.io.min.js"></script>
</head>
<body>

    <div class="pages-wrapper">

        <!-- Page 1: Main Dashboard -->
        <div class="page" id="page-main">
            <div class="dashboard-header">
                <span class="sys-label">HUBERT / SYS</span>
                <span class="sys-status">ONLINE</span>
            </div>
            <div class="dashboard-time" id="clock">09:41</div>
            <div class="dashboard-date" id="date-display">TUESDAY · JULY 28, 2026</div>
            <div class="dashboard-divider"></div>

            <div class="dashboard-container">
                <div class="tile" id="weather-tile">
                    <h2>Weather</h2>
                    <p id="weather-info">Loading...</p>
                </div>
                <div class="tile" id="transit-tile">
                    <h2>Transit</h2>
                    <p id="transit-info">Loading...</p>
                </div>
                <div class="tile" id="todos-tile">
                    <h2>To-Dos</h2>
                    <div class="input-row">
                        <input type="text" id="todo-input" placeholder="Add a task...">
                        <button onclick="addTodo()">Add</button>
                    </div>
                    <ul id="todo-list"></ul>
                </div>
                <div class="tile" id="bucketlist-tile">
                    <h2>Bucket List</h2>
                    <div class="input-row">
                        <input type="text" id="bucketlist-input" placeholder="Add a goal...">
                        <button onclick="addBucketItem()">Add</button>
                    </div>
                    <ul id="bucketlist-list"></ul>
                </div>
                <div class="tile" id="voice-tile">
                    <h2>Assistant</h2>
                    <button id="mic-button" onclick="startListening()">TAP TO SPEAK WITH HUBERT</button>
                    <p id="voice-status">Ready</p>
                    <p id="voice-response"></p>
                </div>
            </div>
        </div>

        <!-- Page 2: Calendar -->
        <div class="page" id="page-calendar">
            <div class="dashboard-header">
                <span class="sys-label">HUBERT / CALENDAR</span>
                <span class="sys-status">ONLINE</span>
            </div>
            <div class="dashboard-divider"></div>
            <div class="dashboard-container">
                <div class="tile" style="grid-column: span 2;">
                    <h2>Calendar</h2>
                    <p style="color:#444;font-size:12px;">Coming soon</p>
                </div>
            </div>
        </div>

        <!-- Page 3: Markets -->
        <div class="page" id="page-stocks">
            <div class="dashboard-header">
                <span class="sys-label">HUBERT / MARKETS</span>
                <span class="sys-status">ONLINE</span>
            </div>
            <div class="dashboard-divider"></div>
            <div class="dashboard-container">
                <div class="tile" style="grid-column: span 2;">
                    <h2>Markets</h2>
                    <p style="color:#444;font-size:12px;">Coming soon</p>
                </div>
            </div>
        </div>

    </div>

    <!-- Dot navigation -->
    <div class="page-dots">
        <span class="dot active" onclick="goToPage(0)"></span>
        <span class="dot" onclick="goToPage(1)"></span>
        <span class="dot" onclick="goToPage(2)"></span>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
